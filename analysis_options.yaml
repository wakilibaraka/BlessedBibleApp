# Static analysis for The Blessed Bible. CI fails on any issue, so keep
# `flutter analyze` at zero. Don't add `// ignore:` without a comment on the
# same line or the line above explaining why.
include: package:flutter_lints/flutter.yaml

analyzer:
  language:
    strict-casts: true
    strict-inference: true
    strict-raw-types: true
  exclude:
    - tool/**
    - build/**
    # Generated by `flutterfire configure` and gitignored.
    - lib/firebase_options.dart

linter:
  rules:
    - always_declare_return_types
    - avoid_dynamic_calls
    - avoid_type_to_string
    - cancel_subscriptions
    - close_sinks
    - prefer_final_locals
    - test_types_in_equals
    - throw_in_finally
    - unawaited_futures
    - unnecessary_await_in_return
    - unnecessary_lambdas
    - unnecessary_statements
    # Considered and left off: avoid_catches_without_on_clauses (most catch-alls
    # are deliberate fallbacks), avoid_slow_async_io (negligible here).
