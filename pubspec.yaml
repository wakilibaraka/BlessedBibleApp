name: the_blessed_bible
description: "A new Flutter project for The Blessed Bible."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.2.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_riverpod: ^3.3.2

  shared_preferences: ^2.5.5
  path_provider: ^2.1.2
  scrollable_positioned_list: ^0.3.8
  share_plus: ^13.3.0
  wakelock_plus: ^1.7.0
  flutter_local_notifications: ^22.2.0
  timezone: ^0.11.1
  package_info_plus: ^10.2.1
  url_launcher: ^6.3.2
  confetti: ^0.8.0
  sqflite: ^2.3.3+1
  path: ^1.9.0
  http: ^1.6.0
  collection: ^1.19.1
  uuid: ^4.6.0
  firebase_core: ^4.13.0
  firebase_auth: ^6.5.7
  google_sign_in: ^6.2.1
  cloud_firestore: ^6.8.0
  sign_in_with_apple: ^8.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.3

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/icon/app_icon.png"
  remove_alpha_ios: true
  adaptive_icon_background: "#4A3220"
  adaptive_icon_foreground: "assets/icon/app_icon.png"

flutter:
  uses-material-design: true
  assets:
    - assets/bible/
    - assets/images/
    - assets/data/
    - assets/icon/
    - assets/reading_plans/
    - assets/reading_plans/source/
    - assets/commentary/
