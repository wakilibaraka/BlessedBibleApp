name: the_blessed_bible
description: "A new Flutter project for The Blessed Bible."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.2.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_riverpod: ^3.3.2
  google_fonts: ^8.2.0
  shared_preferences: ^2.5.5
  path_provider: ^2.1.2
  scrollable_positioned_list: ^0.3.8
  share_plus: ^13.3.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/bible/
    - assets/images/
    - assets/data/
