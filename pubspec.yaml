name: the_blessed_bible
description: "A new Flutter project for The Blessed Bible."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.2.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_riverpod: ^3.3.2

  shared_preferences: ^2.5.5
  path_provider: ^2.1.2
  scrollable_positioned_list: ^0.3.8
  share_plus: ^13.3.0
  wakelock_plus: ^1.7.0
  flutter_local_notifications: ^22.2.0
  timezone: ^0.11.1
  package_info_plus: ^10.2.1
  url_launcher: ^6.3.2
  confetti: ^0.8.0
  sqflite: ^2.3.3+1
  sqlite3_flutter_libs: ^0.5.24
  path: ^1.9.0
  http: ^1.6.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.3

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/icon/app_icon.png"
  remove_alpha_ios: true
  adaptive_icon_background: "#4A3220"
  adaptive_icon_foreground: "assets/icon/app_icon.png"

flutter:
  uses-material-design: true
  assets:
    - assets/bible/
    - assets/images/
    - assets/data/
    - assets/icon/
    - assets/reading_plans/
    - assets/reading_plans/source/
    - assets/commentary/
  fonts:
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter-400-normal.ttf
          weight: 400
        - asset: assets/fonts/Inter-500-normal.ttf
          weight: 500
        - asset: assets/fonts/Inter-600-normal.ttf
          weight: 600
        - asset: assets/fonts/Inter-700-normal.ttf
          weight: 700
    - family: Gentium Book Plus
      fonts:
        - asset: assets/fonts/GentiumBookPlus-400-normal.ttf
          weight: 400
        - asset: assets/fonts/GentiumBookPlus-700-normal.ttf
          weight: 700
    - family: Lora
      fonts:
        - asset: assets/fonts/Lora-400-normal.ttf
          weight: 400
        - asset: assets/fonts/Lora-500-normal.ttf
          weight: 500
        - asset: assets/fonts/Lora-600-normal.ttf
          weight: 600
        - asset: assets/fonts/Lora-700-normal.ttf
          weight: 700
    - family: Literata
      fonts:
        - asset: assets/fonts/Literata-400-normal.ttf
          weight: 400
        - asset: assets/fonts/Literata-500-normal.ttf
          weight: 500
        - asset: assets/fonts/Literata-600-normal.ttf
          weight: 600
        - asset: assets/fonts/Literata-700-normal.ttf
          weight: 700
    - family: Lexend
      fonts:
        - asset: assets/fonts/Lexend-400-normal.ttf
          weight: 400
        - asset: assets/fonts/Lexend-500-normal.ttf
          weight: 500
        - asset: assets/fonts/Lexend-600-normal.ttf
          weight: 600
        - asset: assets/fonts/Lexend-700-normal.ttf
          weight: 700
    - family: EB Garamond
      fonts:
        - asset: assets/fonts/EBGaramond-Regular.ttf
        - asset: assets/fonts/EBGaramond-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/EBGaramond-Bold.ttf
          weight: 700
        - asset: assets/fonts/EBGaramond-Italic.ttf
          style: italic
