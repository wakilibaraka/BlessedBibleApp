name: the_blessed_bible
description: "An offline-first Flutter Bible study app with historicist commentaries, multi-language packs, and dynamic themes."
publish_to: 'none'

version: 1.0.2+9

environment:
  sdk: '>=3.2.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_riverpod: ^3.3.2

  shared_preferences: ^2.5.5
  path_provider: ^2.1.2
  scrollable_positioned_list: ^0.3.8
  share_plus: ^13.3.0
  wakelock_plus: ^1.7.0
  flutter_local_notifications: ^22.3.1
  timezone: ^0.11.1
  package_info_plus: ^10.2.1
  url_launcher: ^6.3.2
  confetti: ^0.8.0
  sqflite: ^2.3.3+1
  path: ^1.9.0
  http: ^1.6.0
  crypto: ^3.0.3
  collection: ^1.19.1
  uuid: ^4.6.0
  firebase_core: ^4.13.0
  firebase_auth: ^6.5.7
  google_sign_in: ^7.2.0
  cloud_firestore: ^6.8.0
  sign_in_with_apple: ^8.1.0
  home_widget: ^0.10.0
  firebase_app_check: ^0.4.8
  firebase_crashlytics: ^5.4.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.3

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/icon/app_icon.png"
  remove_alpha_ios: true
  adaptive_icon_background: "#4A3220"
  adaptive_icon_foreground: "assets/icon/app_icon.png"

flutter:
  uses-material-design: true
  assets:
    - assets/bible/bible.db
    - assets/packs/
    - assets/data/
    - assets/icon/
    - assets/reading_plans/
    - assets/reading_plans/source/
    - assets/commentary/
    - assets/devotional/stories/
    - assets/devotional/art/
  fonts:
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter-400-normal.ttf
          weight: 400
        - asset: assets/fonts/Inter-500-normal.ttf
          weight: 500
        - asset: assets/fonts/Inter-600-normal.ttf
          weight: 600
        - asset: assets/fonts/Inter-700-normal.ttf
          weight: 700
    - family: Gentium Book Plus
      fonts:
        - asset: assets/fonts/GentiumBookPlus-400-normal.ttf
          weight: 400
        - asset: assets/fonts/GentiumBookPlus-700-normal.ttf
          weight: 700
    - family: Lora
      fonts:
        - asset: assets/fonts/Lora-400-normal.ttf
          weight: 400
        - asset: assets/fonts/Lora-500-normal.ttf
          weight: 500
        - asset: assets/fonts/Lora-600-normal.ttf
          weight: 600
        - asset: assets/fonts/Lora-700-normal.ttf
          weight: 700
    - family: Literata
      fonts:
        - asset: assets/fonts/Literata-400-normal.ttf
          weight: 400
        - asset: assets/fonts/Literata-500-normal.ttf
          weight: 500
        - asset: assets/fonts/Literata-600-normal.ttf
          weight: 600
        - asset: assets/fonts/Literata-700-normal.ttf
          weight: 700
    - family: Lexend
      fonts:
        - asset: assets/fonts/Lexend-400-normal.ttf
          weight: 400
        - asset: assets/fonts/Lexend-500-normal.ttf
          weight: 500
        - asset: assets/fonts/Lexend-600-normal.ttf
          weight: 600
        - asset: assets/fonts/Lexend-700-normal.ttf
          weight: 700
    - family: EB Garamond
      fonts:
        - asset: assets/fonts/EBGaramond-Regular.ttf
        - asset: assets/fonts/EBGaramond-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/EBGaramond-Bold.ttf
          weight: 700
        - asset: assets/fonts/EBGaramond-Italic.ttf
          style: italic
    - family: OpenDyslexic
      fonts:
        - asset: assets/fonts/OpenDyslexic-Regular.otf
        - asset: assets/fonts/OpenDyslexic-Bold.otf
          weight: 700
    - family: Bitter
      fonts:
        - asset: assets/fonts/Bitter-Regular.ttf
          weight: 400
        - asset: assets/fonts/Bitter-Bold.ttf
          weight: 700
        - asset: assets/fonts/Bitter-Italic.ttf
          weight: 400
          style: italic
        - asset: assets/fonts/Bitter-BoldItalic.ttf
          weight: 700
          style: italic
    - family: Source Sans 3
      fonts:
        - asset: assets/fonts/SourceSans3-Regular.ttf
          weight: 400
        - asset: assets/fonts/SourceSans3-Bold.ttf
          weight: 700
        - asset: assets/fonts/SourceSans3-Italic.ttf
          weight: 400
          style: italic
        - asset: assets/fonts/SourceSans3-BoldItalic.ttf
          weight: 700
          style: italic
    - family: Cardo
      fonts:
        - asset: assets/fonts/Cardo-Regular.ttf
          weight: 400
        - asset: assets/fonts/Cardo-Bold.ttf
          weight: 700
        - asset: assets/fonts/Cardo-Italic.ttf
          weight: 400
          style: italic
    - family: Noto Serif
      fonts:
        - asset: assets/fonts/NotoSerif-Regular.ttf
          weight: 400
        - asset: assets/fonts/NotoSerif-Italic.ttf
          weight: 400
          style: italic
    - family: Alegreya
      fonts:
        - asset: assets/fonts/Alegreya-Regular.ttf
          weight: 400
        - asset: assets/fonts/Alegreya-Italic.ttf
          weight: 400
          style: italic
    #region Devotional (The Bible Stories) fonts - OFL licensed
    - family: Playfair Display
      fonts:
        - asset: assets/fonts/devotional/PlayfairDisplay-400.ttf
          weight: 400
        - asset: assets/fonts/devotional/PlayfairDisplay-500.ttf
          weight: 500
        - asset: assets/fonts/devotional/PlayfairDisplay-600.ttf
          weight: 600
        - asset: assets/fonts/devotional/PlayfairDisplay-700.ttf
          weight: 700
        - asset: assets/fonts/devotional/PlayfairDisplay-400italic.ttf
          weight: 400
          style: italic
    - family: Cormorant Garamond
      fonts:
        - asset: assets/fonts/devotional/CormorantGaramond-400.ttf
          weight: 400
        - asset: assets/fonts/devotional/CormorantGaramond-500.ttf
          weight: 500
        - asset: assets/fonts/devotional/CormorantGaramond-600.ttf
          weight: 600
        - asset: assets/fonts/devotional/CormorantGaramond-400italic.ttf
          weight: 400
          style: italic
    - family: IM Fell English
      fonts:
        - asset: assets/fonts/devotional/IMFellEnglish-400.ttf
          weight: 400
        - asset: assets/fonts/devotional/IMFellEnglish-400italic.ttf
          weight: 400
          style: italic
    #endregion
